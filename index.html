/* ── TOKENS ──────────────────────────────────────────────────── */
:root {
  --green:        #1A4D3E;
  --green-bright: #4CAF85;
  --gold:         #D4A854;
  --bg:           #F8F9FA;
  --surface:      #FFFFFF;
  --fg:           #1C1C1C;
  --fg2:          #5F6368;
  --border:       #E0E0DC;

  --step-bg:    #1A4D3E;
  --step-fg:    #FFFFFF;
  --label-col:  #1A4D3E;
  --ic-bg:      rgba(26, 77, 62, 0.08);
  --ic-col:     #1A4D3E;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:      #0C0C0C;
    --surface: #161616;
    --fg:      #F0F0EE;
    --fg2:     #9A9EA4;
    --border:  #252525;

    --step-bg:   rgba(76, 175, 133, 0.14);
    --step-fg:   #4CAF85;
    --label-col: #4CAF85;
    --ic-bg:     rgba(76, 175, 133, 0.10);
    --ic-col:    #4CAF85;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:      #0C0C0C;
  --surface: #161616;
  --fg:      #F0F0EE;
  --fg2:     #9A9EA4;
  --border:  #252525;

  --step-bg:   rgba(76, 175, 133, 0.14);
  --step-fg:   #4CAF85;
  --label-col: #4CAF85;
  --ic-bg:     rgba(76, 175, 133, 0.10);
  --ic-col:    #4CAF85;

  color-scheme: dark;
}

/* ── RESET ───────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Safe-area status bar fill */
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--green);
  z-index: 101;
  pointer-events: none;
}

img { max-width: 100%; display: block; }

/* ── NAV ─────────────────────────────────────────────────────── */
.nav {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--green);
  padding-block: 13px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.nav-mark { width: 36px; height: 36px; flex-shrink: 0; }

.nav-wordmark {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.18em;
  color: #FFFFFF;
  text-transform: uppercase;
}

.nav-cta {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--green);
  background: #FFFFFF;
  padding: 7px 14px;
  border-radius: 999px;
  text-decoration: none;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.nav-cta:hover { opacity: 0.88; }
